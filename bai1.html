<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button id="bntRed">Red</button>
    <button id="btnGreen">Green</button>
    <p id="para">This is para</p>
    <script>
        var bntRed = document.getElementById('bntRed');
        var btnGreen = document.getElementById('btnGreen');
        var para = document.getElementById('para')
        console.log(para);
        bntRed.onclick = () => {
            para.style.backgroundColor = "red";
        }
        btnGreen.onclick = () => {
            para.style.backgroundColor = "green";
        }
    </script>
</body>

</html>
